<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EDF2;--card:#fff;--ink:#14213D;--mute:#5B6B82;--line:#CBD5E1;--acc:#E4572E;--ok:#2A9D8F;
--f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0E1626;--card:#17233A;--ink:#EAF0F8;--mute:#9AA9C0;--line:#2A3A57}}
*{box-sizing:border-box}
:root{--cs:#DCEBFF;--cp:#DAF1E3;--co:#E7E2F7;--cd:#FADCE6;--ds:#3B82F6;--dp:#2A9D8F;--do:#8B7CD6;--dd:#E0568A}
@media(prefers-color-scheme:dark){:root{--cs:#1F3556;--cp:#1B4030;--co:#35305A;--cd:#4D2434}}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);padding:env(safe-area-inset-top,0) 0 0}
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.page{display:none}.page.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:15px;font-weight:600;margin:0 0 4px;color:var(--mute)}
.date{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.wx{display:flex;gap:14px;align-items:center}
.wx .t{font-size:40px;font-weight:800;letter-spacing:-.03em}
small{color:var(--mute);display:block}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev.t{grid-template-columns:36px 1fr}
.tm{font-weight:800;font-variant-numeric:tabular-nums}
.tm small{font-weight:400;font-size:12px}
.ev.done .ti,.ev.done .lnk{text-decoration:line-through;color:var(--mute)}
.ev.c{grid-template-columns:64px 1fr;border-top:0;border-radius:12px;padding:8px 10px;margin-bottom:6px}
.c-study{background:var(--cs)}.c-personal{background:var(--cp)}.c-other{background:var(--co)}.c-date{background:var(--cd)}
.live{display:inline-block;font-size:12px;font-weight:600;color:#fff;background:var(--acc);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.leg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}.leg span{padding:3px 10px;border-radius:99px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:4px 4px 4px 16px;display:flex;align-items:center;justify-content:space-between;z-index:5}
#toast button{background:none;color:var(--bg);text-decoration:underline}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label,.seg label{margin:0}
.days input,.seg input{display:none}
.days span{display:inline-block;min-width:42px;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer}
.days input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:6px}.seg label{flex:1}
.seg span{display:block;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer;font-size:15px}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{border:0;border-radius:10px;padding:12px 16px;min-height:44px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.x{background:none;color:var(--mute);padding:8px;min-height:40px}
.lnk{background:none;border:0;color:var(--ink);font-weight:600;text-align:left;padding:0;min-height:40px;display:block;width:100%}
input[type=checkbox].ck{width:26px;height:26px;min-height:0;accent-color:var(--ok)}
.chk{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px}.chk input{width:22px;height:22px;min-height:0}
.pri{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-right:6px;color:#fff}
.p1{background:var(--acc)}.p2{background:#E9A23B;color:#14213D}.p3{background:var(--mute)}
.late{color:var(--acc);font-weight:600}
.empty{color:var(--mute);margin:4px 0}
.hide{display:none!important}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.bar button{flex:1;max-width:260px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.grid b{font-size:12px;color:var(--mute);text-align:center;font-weight:600}
.cell{min-height:52px;padding:4px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.cell.sel{background:var(--ink);color:var(--bg)}.cell.tod{border:2px solid var(--acc)}.cell.mute{opacity:.35}
.dots{display:flex;gap:2px;height:7px}.dots i{width:5px;height:5px;border-radius:50%}
.dots .ds{background:var(--ds)}.dots .dp{background:var(--dp)}.dots .do{background:var(--do)}.dots .dd{background:var(--dd)}.dots .dt{background:var(--acc)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(92vw,360px);font:inherit}
dialog::backdrop{background:rgba(10,20,40,.55)}dialog button{width:100%}dialog p{margin:0 0 10px}
#alarm{text-align:center}.live.tmr{background:var(--ink);color:var(--bg)}
.feat{padding:10px 0;border-top:1px solid var(--line)}.feat:first-of-type{border-top:0}.feat .chk{margin:0}
#msg,#smsg{font-size:14px;color:var(--mute);margin-top:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>

<div id="pMain" class="page on">
  <div class="top"><div><h1 id="greet"></h1><p class="date" id="today"></p></div><button class="sec" data-go="settings" data-i="settings">Settings</button></div>
  <section class="card wx" aria-live="polite">
    <div class="t" id="wxT">--</div>
    <div><strong id="wxD">Weather not set up</strong><small id="wxS">Add your city in Settings.</small></div>
  </section>
  <section class="card hide" id="nudge">
    <strong data-i="backupT">Back up your data</strong><small id="nudgeT"></small>
    <p style="margin:10px 0 0"><button id="nudgeBtn" data-i="backupNow">Back up now</button></p>
  </section>
  <section class="card"><h2 data-i="comingUp">Coming up</h2><div id="todayList"></div></section>
  <section class="card"><h2 data-i="tasks">Tasks</h2><div id="taskList"></div></section>
  <div class="bar"><button class="sec" data-go="calendar" data-i="calendar">Calendar</button><button data-go="add" data-i="add">Add</button></div>
</div>

<div id="pAdd" class="page">
  <div class="top"><button class="sec" data-go="" data-i="back">Back</button></div>
  <h2 id="formH" style="font-size:26px;margin:14px 0">Add new</h2>
  <section class="card">
    <div class="seg" id="kind">
      <label><input type="radio" name="kind" value="event" checked><span data-i="event">Event</span></label>
      <label><input type="radio" name="kind" value="task"><span data-i="task">Task</span></label>
      <label><input type="radio" name="kind" value="date"><span data-i="yearly">Yearly date</span></label>
    </div>
    <label for="title" data-i="title">Title</label>
    <input id="title" autocomplete="off">

    <div id="evBox">
      <label data-i="category">Category</label>
      <div class="seg" id="cats"><label><input type="radio" name="cat" value="study"><span data-i="study">Study</span></label><label><input type="radio" name="cat" value="personal"><span data-i="personal">Personal</span></label><label><input type="radio" name="cat" value="other"><span data-i="others">Others</span></label></div>
      <div class="row" style="margin-top:10px">
        <div><label for="type" data-i="repeats">Repeats</label><select id="type"><option value="once" data-i="noRepeat">Does not repeat</option><option value="daily" data-i="everyDay">Every day</option><option value="weekly" data-i="everyWeek">Every week</option></select></div>
        <div id="dateBox"><label for="date" data-i="date">Date</label><input id="date" type="date"></div>
      </div>
      <div id="dayBox" class="hide"><label data-i="onDays">On these days</label><div class="days" id="days"></div></div>
      <div class="row">
        <div><label for="time" data-i="starts">Starts</label><input id="time" type="time"></div>
        <div><label for="end" data-i="endsOpt">Ends (optional)</label><input id="end" type="time"></div>
      </div>
      <label for="lead" data-i="remindMe">Remind me</label>
      <select id="lead"></select>
    </div>

    <div id="taBox" class="hide">
      <div class="row">
        <div><label for="tdue" data-i="deadline">Deadline</label><input id="tdue" type="date"></div>
        <div><label for="ttime" data-i="timeOpt">Time (optional)</label><input id="ttime" type="time"></div>
      </div>
      <div class="row">
        <div><label for="pri" data-i="priority">Priority</label><select id="pri"><option value="1" data-i="pHigh">High</option><option value="2" data-i="pMed">Medium</option><option value="3" data-i="pLow">Low</option></select></div>
        <div><label for="tlead" data-i="remindMe">Remind me</label><select id="tlead"></select></div>
      </div>
    </div>

    <div id="dtBox" class="hide">
      <div class="row">
        <div><label for="dlabel" data-i="typeL">Type</label><select id="dlabel"><option value="Birthday" data-i="birthday">Birthday</option><option value="Anniversary" data-i="anniv">Anniversary</option><option value="Other" data-i="other">Other</option></select></div>
        <div><label for="ddate" data-i="date">Date</label><input id="ddate" type="date"></div>
      </div>
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="dAge" checked> <span data-i="showAge">Show age or years (uses the year of the date)</span></label>
      <label for="dlead" data-i="remindMe">Remind me</label>
      <select id="dlead"></select>
    </div>

    <label for="note" data-i="note">Note (room, teacher, details)</label>
    <input id="note" data-ip="optional" placeholder="Optional" autocomplete="off">
    <p style="display:flex;gap:10px;margin-bottom:0"><button id="save">Add event</button><button id="del" class="sec hide" data-i="del">Delete</button></p>
    <div id="msg" aria-live="polite"></div>
  </section>
</div>

<div id="pCal" class="page">
  <div class="top"><button class="sec" data-go="" data-i="back">Back</button>
    <div class="seg" style="width:190px"><label><input type="radio" name="cv" value="week" checked><span data-i="week">Week</span></label><label><input type="radio" name="cv" value="month"><span data-i="month">Month</span></label></div></div>
  <div class="top" style="margin:14px 0"><button class="sec" id="prev" aria-label="Previous" data-i="prev">Prev</button><h2 id="calT" style="margin:0;text-align:center"></h2><button class="sec" id="next" aria-label="Next" data-i="next">Next</button></div>
  <div class="leg"><span style="background:var(--cs)" data-i="study">Study</span><span style="background:var(--cp)" data-i="personal">Personal</span><span style="background:var(--co)" data-i="others">Others</span><span style="background:var(--cd)" data-i="birthdays">Birthdays</span></div>
  <div id="calBody"></div>
</div>

<div id="pSet" class="page">
  <div class="top"><button class="sec" data-go="" data-i="back">Back</button></div>
  <h2 style="font-size:26px;margin:14px 0" data-i="settings">Settings</h2>
  <section class="card"><h2 data-i="language">Language</h2>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="pl">Polski</option><option value="de">Deutsch</option></select></section>
  <section class="card">
    <h2 data-i="weatherLoc">Weather location</h2>
    <label for="city" data-i="city">City</label>
    <div class="row"><input id="city" data-ip="phCity" placeholder="e.g. Krakow"><button class="sec" id="geo" data-i="useLoc">Use my location</button></div>
  </section>
  <section class="card">
    <h2 data-i="features">Features</h2>
    <small data-i="featuresD">Turn extra functions on or off.</small>
    <div id="featList"></div>
    <p><button id="notif" class="sec" data-i="notifOn">Turn on notifications</button></p>
    <div id="status"></div>
  </section>
  <section class="card">
    <h2 data-i="backup">Backup</h2>
    <small id="lastB" style="margin-bottom:10px"></small>
    <p style="display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px"><button id="exp" data-i="dlB">Download backup</button><button id="shr" class="sec hide" data-i="sendB">Send backup</button></p>
    <label for="imp" data-i="restoreL">Restore from a backup file (adds to what you have)</label>
    <input id="imp" type="file" accept=".json,application/json">
    <div id="smsg" aria-live="polite"></div>
  </section>
</div>

</main>

<dialog id="alarm"><h2 id="alT" style="font-size:28px"></h2><p id="alB"></p>
  <p><button id="alOff" data-i="dismiss">Dismiss</button></p><p style="margin:0"><button id="alSnz" class="sec" data-i="snooze">Snooze 5 min</button></p></dialog>

<div id="toast" class="hide" role="status"><span data-i="taskDone">Task completed</span><button id="undo" data-i="undo">Undo</button></div>

<dialog id="scope">
  <p><strong data-i="repeatsQ">This event repeats.</strong> <span id="sVerb"></span></p>
  <p><button id="sOne"></button></p>
  <p><button id="sAll" class="sec" data-i="allOcc">All occurrences</button></p>
  <p style="margin:0"><button id="sNo" class="x" data-i="cancel">Cancel</button></p>
</dialog>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.toLocaleDateString('en-CA');
const LOC={en:'en-GB',ru:'ru-RU',pl:'pl-PL',de:'de-DE'},loc=()=>LOC[cfg.lang]||'en-GB';
const dn=i=>new Date(2023,0,1+i).toLocaleDateString(loc(),{weekday:'short'}),shortD=d=>d.toLocaleDateString(loc(),{day:'numeric',month:'short'});
const PRI={get 1(){return t('pHigh')},get 2(){return t('pMed')},get 3(){return t('pLow')}};
const CAT={get study(){return t('study')},get personal(){return t('personal')},get other(){return t('others')}};
const LBL={get Birthday(){return t('birthday')},get Anniversary(){return t('anniv')},get Other(){return t('other')}};
const WXK={0:'0',1:'1',2:'2',3:'3',45:'45',48:'45',51:'51',53:'51',55:'51',61:'61',63:'63',65:'65',71:'71',73:'73',75:'75',80:'80',81:'80',82:'82',95:'95',96:'95',99:'95'};
const wxName=c=>t('w'+(WXK[c]||'x'));
let events=load('db_ev',[]), tasks=load('db_tasks',[]).filter(t=>!t.done), dates=load('db_dates',[]);
const lang0=['ru','pl','de'].find(l=>(navigator.language||'').toLowerCase().startsWith(l))||'en';
let cfg=Object.assign({city:'',lat:null,lon:null,brief:'07:30',eveningAt:'20:00',lang:lang0,lastBackup:null},load('db_cfg',{}));
cfg.feat=Object.assign({weather:true,evening:false,alarm:false},cfg.feat);
let fired=load('db_fired',{}), firedT=load('db_firedT',{}), firedD=load('db_firedD',{}), wx=load('db_wx',null);
let swReg=null, editing=null, calView='week', calRef=new Date(), calSel=ymd(new Date());
const saveAll=()=>{save('db_ev',events);save('db_tasks',tasks);save('db_dates',dates);save('db_cfg',cfg)};

/* ---------- translations ---------- */
const T={
en:{settings:'Settings',backupT:'Back up your data',backupNow:'Back up now',backupNever:'You have not saved a backup yet.',backupDays:'Days since your last backup: {n}',comingUp:'Coming up',tasks:'Tasks',calendar:'Calendar',add:'Add',back:'Back',nothingMore:'Nothing more planned today.',noTasks:'No open tasks.',allDay:'All day',tomorrow:'tomorrow',today:'today',inProg:'in progress',wxNone:'Weather not set up',wxHint:'Add your city in Settings.',wxHL:'High {h}°, low {l}°',rainR:', rain {r}',noRainS:', no rain',gm:'Good morning',ga:'Good afternoon',ge:'Good evening',addNew:'Add new',editEvent:'Edit event',editTask:'Edit task',editDate:'Edit yearly date',event:'Event',task:'Task',yearly:'Yearly date',title:'Title',category:'Category',study:'Study',personal:'Personal',others:'Others',repeats:'Repeats',noRepeat:'Does not repeat',everyDay:'Every day',everyWeek:'Every week',date:'Date',onDays:'On these days',starts:'Starts',endsOpt:'Ends (optional)',remindMe:'Remind me',atStart:'At the start',minB:'{n} min before',hourB:'1 hour before',dayB:'1 day before',weekB:'1 week before',onDay:'On the day, 09:00',noRem:'No reminder',atDl:'At the deadline',deadline:'Deadline',timeOpt:'Time (optional)',priority:'Priority',pHigh:'High',pMed:'Medium',pLow:'Low',typeL:'Type',birthday:'Birthday',anniv:'Anniversary',other:'Other',showAge:'Show age or years (uses the year of the date)',note:'Note (room, teacher, details)',optional:'Optional',saveCh:'Save changes',addEvent:'Add event',addTask:'Add task',addDate:'Add yearly date',del:'Delete',phEvent:'Math class, gym',phTask:'History essay',phDate:'Anna’s birthday',phCity:'e.g. Krakow',enterTitle:'Enter a title.',chooseCat:'Choose a category: Study, Personal or Others.',pickTime:'Pick a start time.',pickDl:'Pick a deadline.',pickDate:'Pick a date.',endAfter:'The end time must be after the start time.',pickDay:'Pick at least one day.',delConfirm:'Delete this item?',repeatsQ:'This event repeats.',applyTo:'Apply your changes to:',deleteQ:'Delete: /* ---------- rows ---------- */
function taskRow(x){
  const now=new Date(),today=ymd(now),hm=now.toTimeString().slice(0,5);
  const late=x.due<today||(x.due===today&&x.time&&x.time<hm);
  return `<div class="ev t">
    <input class="ck" type="checkbox" aria-label="${esc(x.title)}" data-tdone="${x.id}">
    <span><button class="lnk" data-edit="t:${x.id}">${esc(x.title)}</button><small><span class="pri p${x.pri}">${PRI[x.pri]}</span><span class="${late?'late':''}">${late?t('overdue'):t('due')} ${fmtDue(x)}</span>${x.note?', '+esc(x.note):''}</small></span></div>`;
}
function itemRow(it,hm){
  const o=it.o,k=it.date;
  if(it.k==='t')return taskRow(o);
  if(it.k==='d'){const a=ageTxt(o,k);
    return `<div class="ev c c-date"><span class="tm"><small>${t('allDay')}</small></span><span><button class="lnk" data-edit="d:${o.id}">${esc(o.title)}</button><small>${LBL[o.label]||o.label}${a?', '+a:''}${o.note?', '+esc(o.note):''}</small></span></div>`}
  const cat=o.cat||'other',live=hm&&!it.tag&&o.end&&o.time<=hm&&o.end>hm;
  const tg=live?`<span class="live">${t('inProg')}</span>`:it.tag?`<span class="live tmr">${t('tomorrow')}</span>`:'';
  return `<div class="ev c c-${cat}"><span class="tm">${o.time}${o.end?`<small>${t('until',{t:o.end})}</small>`:''}</span>
    <span><button class="lnk" data-edit="e:${o.id}" data-date="${k}">${esc(o.title)}${tg}</button><small>${CAT[cat]||CAT.other}${o.note?', '+esc(o.note):''}</small></span></div>`;
}

/* ---------- render ---------- */
function renderMain(){
  const now=new Date(),h=now.getHours(),hm=now.toTimeString().slice(0,5);
  $('#greet').textContent=t(h<12?'gm':h<18?'ga':'ge');
  $('#today').textContent=now.toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'});
  if(wx){const rt=rainText(wx.rainH);
    $('#wxT').textContent=Math.round(wx.now)+'°';$('#wxD').textContent=wxName(wx.code);
    $('#wxS').textContent=t('wxHL',{h:wx.max,l:wx.min})+(wx.rainH?(rt?t('rainR',{r:rt}):t('noRainS')):'')+(cfg.city?', '+cfg.city:'')}
  else{$('#wxD').textContent=t('wxNone');$('#wxS').textContent=t('wxHint')}
  const its=dayItems(now).filter(i=>i.k!=='t');
  const evT=its.filter(i=>i.k==='e'&&(i.o.end?i.o.end>hm:i.t>hm)).slice(0,3);
  let list=[...its.filter(i=>i.k==='d'),...evT];
  if(!evT.length){const tm=new Date(now.getTime()+864e5);
    list=[...list,...dayItems(tm).filter(i=>i.k==='e').slice(0,3).map(i=>({...i,tag:1}))]}
  $('#todayList').innerHTML=list.length?list.map(i=>itemRow(i,hm)).join(''):`<p class="empty">${t('nothingMore')}</p>`;
  const key=x=>x.due+(x.time||'99');
  const open=tasks.filter(x=>!x.done).sort((a,b)=>key(a)<key(b)?-1:key(a)>key(b)?1:a.pri-b.pri);
  $('#taskList').innerHTML=open.length?open.map(taskRow).join(''):`<p class="empty">${t('noTasks')}</p>`;
  const total=events.length+tasks.length+dates.length;
  const days=cfg.lastBackup?Math.floor((Date.now()-new Date(cfg.lastBackup))/864e5):null;
  $('#nudge').classList.toggle('hide',!(total>0&&(days===null||days>=14)));
  $('#nudgeT').textContent=days===null?t('backupNever'):t('backupDays',{n:days});
}
function renderCal(){
  const body=$('#calBody'),M=new Date(calRef),none=`<p class="empty">${t('nothingPl')}</p>`;
  if(calView==='week'){
    const s=new Date(M);s.setDate(s.getDate()-((s.getDay()+6)%7));
    const e=new Date(s);e.setDate(e.getDate()+6);
    $('#calT').textContent=shortD(s)+' – '+shortD(e);
    let html='';
    for(let i=0;i<7;i++){const d=new Date(s);d.setDate(d.getDate()+i);const its=dayItems(d);
      html+=`<section class="card"><h2>${d.toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'short'})}</h2>${its.length?its.map(x=>itemRow(x,false)).join(''):none}</section>`}
    body.innerHTML=html;
  }else{
    M.setDate(1);
    $('#calT').textContent=M.toLocaleDateString(loc(),{month:'long',year:'numeric'});
    const lead=(M.getDay()+6)%7,n=new Date(M.getFullYear(),M.getMonth()+1,0).getDate(),today=ymd(new Date());
    if(calSel.slice(0,7)!==ymd(M).slice(0,7))calSel=ymd(M);
    let g=[1,2,3,4,5,6,0].map(d=>`<b>${dn(d)}</b>`).join('')+'<span></span>'.repeat(lead);
    for(let i=1;i<=n;i++){const d=new Date(M.getFullYear(),M.getMonth(),i),k=ymd(d),its=dayItems(d);
      const dots=[...new Set(its.map(x=>x.k==='e'?'d'+(x.o.cat||'other')[0]:x.k==='t'?'dt':'dd'))].map(c=>`<i class="${c}"></i>`).join('');
      g+=`<button class="cell ${k===calSel?'sel':''} ${k===today?'tod':''}" data-day="${k}" aria-label="${dLabel(k)}">${i}<span class="dots">${dots}</span></button>`}
    const its=dayItems(new Date(calSel+'T00:00'));
    body.innerHTML=`<div class="grid">${g}</div><section class="card"><h2>${dLabel(calSel)}</h2>${its.length?its.map(x=>itemRow(x,false)).join(''):none}</section>`;
  }
}
const FEATURES=[{id:'weather',n:'fWeather',d:'fWeatherD',time:'brief'},{id:'evening',n:'fEvening',d:'fEveningD',time:'eveningAt'},{id:'alarm',n:'fAlarm',d:'fAlarmD',test:1}];
function renderFeat(){
  $('#featList').innerHTML=FEATURES.map(f=>{const on=cfg.feat[f.id];
    return `<div class="feat"><label class="chk"><input type="checkbox" data-feat="${f.id}" ${on?'checked':''}><b>${t(f.n)}</b></label><small>${t(f.d)}</small>`
    +(on&&f.time?`<div class="row" style="margin-top:8px"><div><label>${t('sendAt')}</label><input type="time" data-ftime="${f.time}" value="${cfg[f.time]}"></div><span></span></div>`:'')
    +(on&&f.test?`<p style="margin:8px 0 0"><button class="sec" data-test="${f.id}">${t('test')}</button></p>`:'')+'</div>'}).join('');
}
function renderSet(){
  const p='Notification' in window?Notification.permission:'unsupported';
  $('#status').textContent=t(p==='granted'?'stOn':p==='denied'?'stDen':p==='unsupported'?'stUns':'stOff');
  $('#lastB').textContent=cfg.lastBackup?t('lastB',{d:new Date(cfg.lastBackup).toLocaleString(loc())}):t('noB');
  try{$('#shr').classList.toggle('hide',!(navigator.canShare&&navigator.canShare({files:[backupFile()]})))}catch{}
}
function fillSet(){$('#city').value=cfg.city||'';$('#lang').value=cfg.lang;renderFeat();renderSet()}
function render(){renderMain();if($('#pCal').classList.contains('on'))renderCal();if($('#pSet').classList.contains('on'))renderSet()}

/* ---------- routing ---------- */
const PAGES={'':'pMain',add:'pAdd',calendar:'pCal',settings:'pSet'};
const go=h=>{if(location.hash.slice(1)===h)route();else location.hash=h};
function route(){
  const id=PAGES[location.hash.slice(1)]||'pMain';
  $$('.page').forEach(p=>p.classList.toggle('on',p.id===id));
  if(id!=='pAdd')editing=null;else editing?fillForm():resetForm();
  if(id==='pSet')fillSet();
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- form ---------- */
const curKind=()=>$('input[name=kind]:checked').value;
function setKind(k){
  $(`input[name=kind][value=${k}]`).checked=true;
  $('#evBox').classList.toggle('hide',k!=='event');$('#taBox').classList.toggle('hide',k!=='task');$('#dtBox').classList.toggle('hide',k!=='date');
  $('#title').placeholder=t({event:'phEvent',task:'phTask',date:'phDate'}[k]);
  $('#save').textContent=editing?t('saveCh'):t({event:'addEvent',task:'addTask',date:'addDate'}[k]);
}
function typeCh(){const t=$('#type').value;$('#dateBox').classList.toggle('hide',t!=='once');$('#dayBox').classList.toggle('hide',t!=='weekly')}
function resetForm(){
  editing=null;const tm=new Date();tm.setDate(tm.getDate()+1);
  $('#formH').textContent=t('addNew');$('#kind').classList.remove('hide');$('#del').classList.add('hide');$('#msg').textContent='';
  $('#title').value='';$('#note').value='';$('#type').value='once';$('#date').value=ymd(new Date());
  $('#time').value='08:00';$('#end').value='';$('#lead').value='15';$$('#days input').forEach(i=>i.checked=false);$$('input[name=cat]').forEach(i=>{i.checked=false});
  $('#tdue').value=ymd(tm);$('#ttime').value='';$('#pri').value='2';$('#tlead').value='60';
  $('#dlabel').value='Birthday';$('#ddate').value=ymd(new Date());$('#dAge').checked=true;$('#dlead').value='0';
  typeCh();setKind('event');
}
function fillForm(){
  const E=editing,kind=E.kind;
  const o=(kind==='event'?events:kind==='task'?tasks:dates).find(x=>x.id===E.id);
  if(!o){editing=null;resetForm();return}
  resetForm();editing=E;
  const e=kind==='event'&&E.date?eff(o,E.date):o;
  $('#formH').textContent=t(kind==='date'?'editDate':kind==='task'?'editTask':'editEvent')+(kind==='event'&&o.type!=='once'&&E.date?' ('+dLabel(E.date)+')':'');
  $('#kind').classList.add('hide');$('#del').classList.remove('hide');
  $('#title').value=e.title;$('#note').value=e.note||'';
  if(kind==='event'){
    $('#type').value=o.type;typeCh();$('#date').value=o.date||ymd(new Date());
    $$('#days input').forEach(i=>{i.checked=(o.days||[]).includes(+i.value)});
    $('#time').value=e.time;$('#end').value=e.end||'';$('#lead').value=String(e.lead||0);
    const cr=$(`input[name=cat][value=${e.cat||'other'}]`);if(cr)cr.checked=true;
  }else if(kind==='task'){
    $('#tdue').value=o.due;$('#ttime').value=o.time||'';$('#pri').value=String(o.pri);$('#tlead').value=String(o.lead);
  }else{
    $('#dlabel').value=o.label;$('#ddate').value=`${o.year}-${o.md}`;$('#dAge').checked=!!o.showAge;$('#dlead').value=String(o.lead);
  }
  setKind(kind);
}
const msg=t=>{$('#msg').textContent=t};
function askScope(verb,cb){
  const d=$('#scope');$('#sVerb').textContent=verb;$('#sOne').textContent=t('onlyDay',{d:dLabel(editing.date)});
  const fin=v=>{d.close();if(v)cb(v)};
  $('#sOne').onclick=()=>fin('one');$('#sAll').onclick=()=>fin('all');$('#sNo').onclick=()=>fin(null);
  d.showModal();
}
const finish=()=>{editing=null;saveAll();go('')};
$('#kind').onchange=()=>setKind(curKind());
$('#type').onchange=typeCh;


$('#save').onclick=()=>{
  const title=$('#title').value.trim(),kind=curKind(),note=$('#note').value.trim();
  if(!title){msg(t('enterTitle'));$('#title').focus();return}
  if(kind==='task'){
    const due=$('#tdue').value;if(!due){msg(t('pickDl'));return}
    const tk={title,pri:+$('#pri').value,due,time:$('#ttime').value,lead:+$('#tlead').value,note};
    if(editing)Object.assign(tasks.find(x=>x.id===editing.id),tk);else tasks.push({id:Date.now().toString(36),done:false,...tk});
    return finish();
  }
  if(kind==='date'){
    const v=$('#ddate').value;if(!v){msg(t('pickDate'));return}
    const x={title,label:$('#dlabel').value,md:v.slice(5),year:+v.slice(0,4),showAge:$('#dAge').checked,lead:+$('#dlead').value,note};
    if(editing)Object.assign(dates.find(y=>y.id===editing.id),x);else dates.push({id:Date.now().toString(36),...x});
    return finish();
  }
  const catEl=$('input[name=cat]:checked');if(!catEl){msg(t('chooseCat'));return}
  const time=$('#time').value,end=$('#end').value,type=$('#type').value;
  if(!time){msg(t('pickTime'));return}
  if(end&&end<=time){msg(t('endAfter'));return}
  const n={title,time,end,type,lead:+$('#lead').value,note,cat:catEl.value};
  if(type==='once'){n.date=$('#date').value;if(!n.date){msg(t('pickDate'));return}}
  if(type==='weekly'){n.days=$$('#days input:checked').map(i=>+i.value);if(!n.days.length){msg(t('pickDay'));return}}
  if(!editing){events.push({id:Date.now().toString(36),done:{},...n});return finish()}
  const o=events.find(x=>x.id===editing.id);
  const apply=scope=>{
    if(scope==='one'){o.over=o.over||{};o.over[editing.date]={title:n.title,time:n.time,end:n.end,note:n.note,lead:n.lead,cat:n.cat}}
    else{Object.assign(o,{title,time,end,type,lead:n.lead,note,cat:n.cat});
      if(type==='once')o.date=n.date;else delete o.date;
      if(type==='weekly')o.days=n.days;else delete o.days}
    finish();
  };
  if(o.type!=='once'&&editing.date)askScope(t('applyTo'),apply);else apply('all');
};
$('#del').onclick=()=>{
  const E=editing;if(!E)return;
  const drop=()=>{if(E.kind==='event')events=events.filter(x=>x.id!==E.id);else if(E.kind==='task')tasks=tasks.filter(x=>x.id!==E.id);else dates=dates.filter(x=>x.id!==E.id);finish()};
  if(E.kind==='event'){
    const o=events.find(x=>x.id===E.id);
    if(o.type!=='once'&&E.date){askScope(t('deleteQ'),v=>{if(v==='one'){o.over=o.over||{};o.over[E.date]={skip:true};finish()}else drop()});return}
  }
  if(confirm(t('delConfirm')))drop();
};

/* ---------- clicks ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-go],[data-edit],[data-tclear],[data-day],[data-test]');if(!b)return;
  const d=b.dataset;
  if(d.go!==undefined)go(d.go);
  else if(d.edit){const [k,id]=d.edit.split(':');editing={kind:{e:'event',t:'task',d:'date'}[k],id,date:d.date||null};go('add')}
  else if(d.tclear!==undefined){tasks=tasks.filter(x=>!x.done);saveAll();render()}
  else if(d.day){calSel=d.day;renderCal()}
  else if(d.test){unlockAudio();alarm({title:t('alarmT')},t('test'))}
});
document.addEventListener('change',ev=>{
  const d=ev.target.dataset||{};
  if(d.tdone)completeTask(d.tdone);
  else if(d.feat){cfg.feat[d.feat]=ev.target.checked;
    if(ev.target.checked){unlockAudio();if(d.feat!=='alarm'&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(renderSet)}
    saveAll();renderFeat()}
  else if(d.ftime){cfg[d.ftime]=ev.target.value||cfg[d.ftime];saveAll()}
});
$$('input[name=cv]').forEach(r=>r.onchange=()=>{calView=r.value;if(calView==='month')calSel=ymd(calRef);renderCal()});
const step=n=>{if(calView==='week')calRef.setDate(calRef.getDate()+7*n);else{calRef.setDate(1);calRef.setMonth(calRef.getMonth()+n)}renderCal()};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);

/* ---------- completing tasks ---------- */
let lastTask=null,toastTimer;
function completeTask(id){
  const i=tasks.findIndex(x=>x.id===id);if(i<0)return;
  lastTask=tasks.splice(i,1)[0];saveAll();render();
  $('#toast').classList.remove('hide');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),6000);
}
$('#undo').onclick=()=>{if(lastTask){tasks.push(lastTask);lastTask=null;saveAll();render()}$('#toast').classList.add('hide')};

/* ---------- backup ---------- */
const backupObj=()=>({app:'daybook',version:3,exported:new Date().toISOString(),events,tasks,dates,settings:{city:cfg.city,lat:cfg.lat,lon:cfg.lon,brief:cfg.brief,eveningAt:cfg.eveningAt,lang:cfg.lang,feat:cfg.feat}});
const backupFile=()=>new File([JSON.stringify(backupObj(),null,1)],`daybook-backup-${ymd(new Date())}.json`,{type:'application/json'});
function marked(){cfg.lastBackup=new Date().toISOString();saveAll();render()}
function download(){
  const f=backupFile(),a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);marked();
  $('#smsg').textContent=t('savedMsg',{f:f.name});
}
$('#exp').onclick=download;
$('#nudgeBtn').onclick=download;
$('#shr').onclick=async()=>{try{await navigator.share({files:[backupFile()],title:'Daybook backup'});marked()}catch{}};
$('#imp').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  try{
    const j=JSON.parse(await f.text());if(j.app!=='daybook')throw 0;
    const merge=(a,b)=>{const m=new Map(a.map(x=>[x.id,x]));(b||[]).forEach(x=>{if(x&&x.id)m.set(x.id,x)});return[...m.values()]};
    events=merge(events,j.events);tasks=merge(tasks,(j.tasks||[]).filter(t=>!t.done));dates=merge(dates,j.dates);
    if(j.settings&&cfg.lat==null&&!cfg.city)Object.assign(cfg,j.settings);
    saveAll();render();fetchWeather();
    $('#smsg').textContent=t('restored',{a:(j.events||[]).length,b:(j.tasks||[]).length,c:(j.dates||[]).length});
  }catch{$('#smsg').textContent=t('badFile')}
  ev.target.value='';
};

/* ---------- settings ---------- */
async function fetchWeather(){
  if(cfg.lat==null)return;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${cfg.lat}&longitude=${cfg.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=precipitation_probability,precipitation&timezone=auto&forecast_days=1`;
    const j=await (await fetch(u)).json(),rainH=[];
    j.hourly.time.forEach((t,i)=>{if((j.hourly.precipitation_probability[i]||0)>=50||(j.hourly.precipitation[i]||0)>=0.3)rainH.push(+t.slice(11,13))});
    wx={date:ymd(new Date()),now:j.current.temperature_2m,code:j.current.weather_code,max:Math.round(j.daily.temperature_2m_max[0]),min:Math.round(j.daily.temperature_2m_min[0]),rain:j.daily.precipitation_probability_max[0]||0,rainH};
    save('db_wx',wx);render();
  }catch{$('#wxS').textContent=t('wxErr')}
}
$('#city').addEventListener('change',async()=>{
  const name=$('#city').value.trim();if(!name)return;
  try{
    const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1`)).json();
    if(!j.results){$('#status').textContent=t('cityNF');return}
    const r=j.results[0];cfg.city=r.name;cfg.lat=r.latitude;cfg.lon=r.longitude;saveAll();fetchWeather();render();
  }catch{$('#status').textContent=t('cityErr')}
});
$('#geo').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{
  cfg.lat=p.coords.latitude;cfg.lon=p.coords.longitude;cfg.city='';saveAll();fetchWeather();
},()=>{$('#status').textContent=t('geoErr')});

$('#notif').onclick=async()=>{if(!('Notification' in window))return;await Notification.requestPermission();render();tick()};

/* ---------- notifications ---------- */
const canNotify=()=>'Notification' in window&&Notification.permission==='granted';
async function notify(title,body,opts={}){
  if(!canNotify())return;
  const o={body,tag:title+body,icon:'icon-192.png',vibrate:[120,60,120],...opts};
  try{if(swReg)await swReg.showNotification(title,o);else new Notification(title,o)}
  catch(e){try{new Notification(title,o)}catch{}}
}
let actx=null,ringT=null,curAl=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch{}}
['pointerdown','keydown'].forEach(n=>document.addEventListener(n,unlockAudio,{once:true}));
function beep(f){if(!actx||actx.state!=='running')return;const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.2)}
function stopRing(){clearInterval(ringT);ringT=null;try{navigator.vibrate&&navigator.vibrate(0)}catch{}}
function ring(){stopRing();let n=0;const c=()=>{beep(880);setTimeout(()=>beep(660),250);try{navigator.vibrate&&navigator.vibrate([400,150,400])}catch{}if(++n>40)stopRing()};c();ringT=setInterval(c,1500)}
function alarm(e,body){
  curAl={title:e.title,body};
  notify(t('alarmT')+': '+e.title,body,{requireInteraction:true,vibrate:[600,200,600,200,600,200,600],renotify:true});
  $('#alT').textContent=e.title;$('#alB').textContent=body;
  const d=$('#alarm');if(!d.open)d.showModal();ring();
}
$('#alarm').addEventListener('close',stopRing);
$('#alOff').onclick=()=>$('#alarm').close();
$('#alSnz').onclick=()=>{$('#alarm').close();const a=curAl;setTimeout(()=>alarm({title:a.title},a.body),5*6e4)};
$('#lang').onchange=()=>{cfg.lang=$('#lang').value;saveAll();applyLang();render();fillSet()};
async function sendBrief(){
  await fetchWeather();
  const its=dayItems(new Date()),n=its.filter(i=>i.k!=='t').length,m=its.length-n;
  notify(t('gm'),(wxSummary()||t('wxUnavail'))+' '+t('briefCnt',{n,m}));
}
function sendEvening(){
  const its=dayItems(new Date(Date.now()+864e5));
  const ln=i=>i.k==='e'?`${i.o.time}${i.o.end?'–'+i.o.end:''} ${i.o.title}`:i.k==='d'?i.o.title:t('taskN',{x:i.o.title});
  notify(t('tmrPlan'),its.length?its.map(ln).join('\n'):t('nothingTom'));
}
function tick(){
  const cn=canNotify();
  if(!cn&&!cfg.feat.alarm)return;
  const now=new Date(),today=ymd(now),tom=new Date(now.getTime()+864e5);
  for(const k of Object.keys(fired))if(!k.startsWith(today))delete fired[k];
  for(const e0 of events){
    const onToday=occursOn(e0,now);
    if(!onToday&&!occursOn(e0,tom))continue;
    const base=onToday?now:tom,e=eff(e0,ymd(base));
    if(!onToday&&!(e.lead>=1440))continue;
    const st=at(base,e.time).getTime(),fire=st-(e.lead||0)*6e4,key=today+'|'+e.id;
    if(now>=fire&&now.getTime()<=st+10*6e4&&!fired[key]){
      fired[key]=1;
      const body=(e.lead?t('startsAt',{t:e.time}):t('nowAt',{t:e.time}))+(e.end?' '+t('until',{t:e.end}):'')+(e.note?'. '+e.note:'');
      if(cfg.feat.alarm)alarm(e,body);else notify(e.title,body);
    }
  }
  if(cn){
    for(const tk of tasks){
      if(tk.lead<0||firedT[tk.id])continue;
      const due=at(new Date(tk.due+'T00:00'),tk.time||'09:00').getTime(),fire=due-tk.lead*6e4;
      if(now.getTime()>=fire&&now.getTime()<=due+6*36e5){firedT[tk.id]=1;notify(t('taskN',{x:tk.title}),t('dueTxt',{d:fmtDue(tk),p:PRI[tk.pri]})+(tk.note?'. '+tk.note:''))}
    }
    for(const x of dates){
      if(x.lead<0||now.getHours()<9)continue;
      const occ=new Date(now.getFullYear(),now.getMonth(),now.getDate()+x.lead),ok=ymd(occ);
      if(ok.slice(5)!==x.md||firedD[x.id+'|'+ok])continue;
      firedD[x.id+'|'+ok]=1;const a=ageTxt(x,ok);
      notify(t(x.lead===0?'todayP':x.lead===1?'tomP':'in7')+x.title,(a?a+'. ':'')+(x.note||''));
    }
    const win=hm=>{const b=at(now,hm).getTime();return now.getTime()>=b&&now.getTime()<=b+60*6e4};
    if(cfg.feat.weather&&win(cfg.brief)&&!fired[today+'|brief']){fired[today+'|brief']=1;sendBrief()}
    if(cfg.feat.evening&&win(cfg.eveningAt)&&!fired[today+'|eve']){fired[today+'|eve']=1;sendEvening()}
  }
  save('db_fired',fired);save('db_firedT',firedT);save('db_firedD',firedD);
}

/* ---------- start ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
applyLang();route();fetchWeather();tick();
setInterval(tick,20000);setInterval(render,60000);setInterval(fetchWeather,30*60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();tick();fetchWeather()}});
</script>
