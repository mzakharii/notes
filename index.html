<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daybook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EDF2;--card:#fff;--ink:#14213D;--mute:#5B6B82;--line:#CBD5E1;--acc:#E4572E;--ok:#2A9D8F;
--f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0E1626;--card:#17233A;--ink:#EAF0F8;--mute:#9AA9C0;--line:#2A3A57}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);padding:env(safe-area-inset-top,0) 0 0}
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.page{display:none}.page.on{display:block}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:15px;font-weight:600;margin:0 0 4px;color:var(--mute)}
.date{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.wx{display:flex;gap:14px;align-items:center}
.wx .t{font-size:40px;font-weight:800;letter-spacing:-.03em}
small{color:var(--mute);display:block}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev.t{grid-template-columns:36px 1fr}
.tm{font-weight:800;font-variant-numeric:tabular-nums}
.tm small{font-weight:400;font-size:12px}
.ev.done .ti,.ev.done .lnk{text-decoration:line-through;color:var(--mute)}
.ev.next{box-shadow:inset 3px 0 0 var(--acc);padding-left:10px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label,.seg label{margin:0}
.days input,.seg input{display:none}
.days span{display:inline-block;min-width:42px;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer}
.days input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:6px}.seg label{flex:1}
.seg span{display:block;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;font-weight:600;cursor:pointer;font-size:15px}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button{border:0;border-radius:10px;padding:12px 16px;min-height:44px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.x{background:none;color:var(--mute);padding:8px;min-height:40px}
.lnk{background:none;border:0;color:var(--ink);font-weight:600;text-align:left;padding:0;min-height:40px;display:block;width:100%}
input[type=checkbox].ck{width:26px;height:26px;min-height:0;accent-color:var(--ok)}
.chk{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px}.chk input{width:22px;height:22px;min-height:0}
.pri{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-right:6px;color:#fff}
.p1{background:var(--acc)}.p2{background:#E9A23B;color:#14213D}.p3{background:var(--mute)}
.late{color:var(--acc);font-weight:600}
.empty{color:var(--mute);margin:4px 0}
.hide{display:none!important}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.bar button{flex:1;max-width:260px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.grid b{font-size:12px;color:var(--mute);text-align:center;font-weight:600}
.cell{min-height:52px;padding:4px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.cell.sel{background:var(--ink);color:var(--bg)}.cell.tod{border:2px solid var(--acc)}.cell.mute{opacity:.35}
.dots{display:flex;gap:3px;height:8px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--mute)}
.dots .d1{background:var(--acc)}.dots .d2{background:var(--ok)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(92vw,360px);font:inherit}
dialog::backdrop{background:rgba(10,20,40,.55)}dialog button{width:100%}dialog p{margin:0 0 10px}
#msg,#smsg{font-size:14px;color:var(--mute);margin-top:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>

<div id="pMain" class="page on">
  <div class="top"><div><h1 id="greet"></h1><p class="date" id="today"></p></div><button class="sec" data-go="settings">Settings</button></div>
  <section class="card wx" aria-live="polite">
    <div class="t" id="wxT">--</div>
    <div><strong id="wxD">Weather not set up</strong><small id="wxS">Add your city in Settings.</small></div>
  </section>
  <section class="card hide" id="nudge">
    <strong>Back up your data</strong><small id="nudgeT"></small>
    <p style="margin:10px 0 0"><button id="nudgeBtn">Back up now</button></p>
  </section>
  <section class="card"><h2>Today</h2><div id="todayList"></div></section>
  <section class="card"><h2>Tasks</h2><div id="taskList"></div></section>
  <div class="bar"><button class="sec" data-go="calendar">Calendar</button><button data-go="add">Add</button></div>
</div>

<div id="pAdd" class="page">
  <div class="top"><button class="sec" data-go="">Back</button></div>
  <h2 id="formH" style="font-size:26px;margin:14px 0">Add new</h2>
  <section class="card">
    <div class="seg" id="kind">
      <label><input type="radio" name="kind" value="event" checked><span>Event</span></label>
      <label><input type="radio" name="kind" value="task"><span>Task</span></label>
      <label><input type="radio" name="kind" value="date"><span>Yearly date</span></label>
    </div>
    <label for="title">Title</label>
    <input id="title" autocomplete="off">

    <div id="evBox">
      <div class="row" style="margin-top:10px">
        <div><label for="type">Repeats</label><select id="type"><option value="once">Does not repeat</option><option value="daily">Every day</option><option value="weekly">Every week</option></select></div>
        <div id="dateBox"><label for="date">Date</label><input id="date" type="date"></div>
      </div>
      <div id="dayBox" class="hide"><label>On these days</label><div class="days" id="days"></div></div>
      <div class="row">
        <div><label for="time">Starts</label><input id="time" type="time"></div>
        <div><label for="end">Ends (optional)</label><input id="end" type="time"></div>
      </div>
      <label for="lead">Remind me</label>
      <select id="lead"><option value="0">At the start</option><option value="5">5 min before</option><option value="10">10 min before</option><option value="15">15 min before</option><option value="30">30 min before</option><option value="60">1 hour before</option><option value="1440">1 day before</option></select>
    </div>

    <div id="taBox" class="hide">
      <div class="row">
        <div><label for="tdue">Deadline</label><input id="tdue" type="date"></div>
        <div><label for="ttime">Time (optional)</label><input id="ttime" type="time"></div>
      </div>
      <div class="row">
        <div><label for="pri">Priority</label><select id="pri"><option value="1">High</option><option value="2">Medium</option><option value="3">Low</option></select></div>
        <div><label for="tlead">Remind me</label><select id="tlead"><option value="-1">No reminder</option><option value="0">At the deadline</option><option value="60">1 hour before</option><option value="1440">1 day before</option></select></div>
      </div>
    </div>

    <div id="dtBox" class="hide">
      <div class="row">
        <div><label for="dlabel">Type</label><select id="dlabel"><option>Birthday</option><option>Anniversary</option><option>Other</option></select></div>
        <div><label for="ddate">Date</label><input id="ddate" type="date"></div>
      </div>
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="dAge" checked> Show age or years (uses the year of the date)</label>
      <label for="dlead">Remind me</label>
      <select id="dlead"><option value="0">On the day, 09:00</option><option value="1">1 day before</option><option value="7">1 week before</option><option value="-1">No reminder</option></select>
    </div>

    <label for="note">Note (room, teacher, details)</label>
    <input id="note" placeholder="Optional" autocomplete="off">
    <p style="display:flex;gap:10px;margin-bottom:0"><button id="save">Add event</button><button id="del" class="sec hide">Delete</button></p>
    <div id="msg" aria-live="polite"></div>
  </section>
</div>

<div id="pCal" class="page">
  <div class="top"><button class="sec" data-go="">Back</button>
    <div class="seg" style="width:190px"><label><input type="radio" name="cv" value="week" checked><span>Week</span></label><label><input type="radio" name="cv" value="month"><span>Month</span></label></div></div>
  <div class="top" style="margin:14px 0"><button class="sec" id="prev" aria-label="Previous">Prev</button><h2 id="calT" style="margin:0;text-align:center"></h2><button class="sec" id="next" aria-label="Next">Next</button></div>
  <div id="calBody"></div>
</div>

<div id="pSet" class="page">
  <div class="top"><button class="sec" data-go="">Back</button></div>
  <h2 style="font-size:26px;margin:14px 0">Settings</h2>
  <section class="card">
    <h2>Weather</h2>
    <label for="city">City</label>
    <div class="row"><input id="city" placeholder="e.g. Krakow"><button class="sec" id="geo">Use my location</button></div>
    <label for="brief">Morning summary at</label>
    <input id="brief" type="time">
    <p><button id="notif" class="sec">Turn on notifications</button></p>
    <div id="status"></div>
  </section>
  <section class="card">
    <h2>Backup</h2>
    <small id="lastB" style="margin-bottom:10px"></small>
    <p style="display:flex;gap:10px;flex-wrap:wrap;margin:0 0 10px"><button id="exp">Download backup</button><button id="shr" class="sec hide">Send backup</button></p>
    <label for="imp">Restore from a backup file (adds to what you have)</label>
    <input id="imp" type="file" accept=".json,application/json">
    <div id="smsg" aria-live="polite"></div>
  </section>
</div>

</main>

<dialog id="scope">
  <p><strong>This event repeats.</strong> <span id="sVerb"></span></p>
  <p><button id="sOne"></button></p>
  <p><button id="sAll" class="sec">All occurrences</button></p>
  <p style="margin:0"><button id="sNo" class="x">Cancel</button></p>
</dialog>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.toLocaleDateString('en-CA');
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PRI={1:'High',2:'Medium',3:'Low'};
const WX={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Heavy showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
let events=load('db_ev',[]), tasks=load('db_tasks',[]), dates=load('db_dates',[]);
let cfg=Object.assign({city:'',lat:null,lon:null,brief:'07:30',lastBackup:null},load('db_cfg',{}));
let fired=load('db_fired',{}), firedT=load('db_firedT',{}), firedD=load('db_firedD',{}), wx=load('db_wx',null);
let swReg=null, editing=null, calView='week', calRef=new Date(), calSel=ymd(new Date());
const saveAll=()=>{save('db_ev',events);save('db_tasks',tasks);save('db_dates',dates);save('db_cfg',cfg)};

/* ---------- helpers ---------- */
function occursOn(e,d){
  const k=ymd(d);if(e.over&&e.over[k]&&e.over[k].skip)return false;
  if(e.type==='once')return e.date===k;
  if(e.type==='daily')return true;
  return (e.days||[]).includes(d.getDay());
}
const eff=(e,k)=>e.over&&e.over[k]?{...e,...e.over[k]}:e;
const at=(d,hm)=>{const [h,m]=hm.split(':').map(Number);const t=new Date(d);t.setHours(h,m,0,0);return t};
const dLabel=k=>new Date(k+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const ageTxt=(x,k)=>{if(!x.showAge||!x.year)return'';const n=+k.slice(0,4)-x.year;if(n<=0)return'';return x.label==='Birthday'?`turns ${n}`:`${n} years`};
function fmtDue(t){
  const d=new Date(t.due+'T00:00'),n=new Date();n.setHours(0,0,0,0);
  const diff=Math.round((d-n)/864e5);
  return (diff===0?'today':diff===1?'tomorrow':dLabel(t.due))+(t.time?' at '+t.time:'');
}
function wxSummary(){
  if(!wx)return '';
  return `${WX[wx.code]||'Weather'}, ${wx.min}° to ${wx.max}°C, ${wx.rain}% chance of rain`+(wx.rain>=50?'. Take an umbrella.':'.');
}
function dayItems(d){
  const k=ymd(d),out=[];
  for(const e of events)if(occursOn(e,d)){const o=eff(e,k);out.push({k:'e',t:o.time,o,date:k})}
  for(const x of dates)if(x.md===k.slice(5))out.push({k:'d',t:'00:00',o:x,date:k});
  for(const t of tasks)if(!t.done&&t.due===k)out.push({k:'t',t:t.time||'23:59',o:t,date:k});
  return out.sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0);
}

/* ---------- rows ---------- */
function taskRow(t){
  const now=new Date(),today=ymd(now),hm=now.toTimeString().slice(0,5);
  const late=!t.done&&(t.due<today||(t.due===today&&t.time&&t.time<hm));
  return `<div class="ev t ${t.done?'done':''}">
    <input class="ck" type="checkbox" aria-label="Done: ${esc(t.title)}" ${t.done?'checked':''} data-tdone="${t.id}">
    <span><button class="lnk" data-edit="t:${t.id}">${esc(t.title)}</button><small><span class="pri p${t.pri}">${PRI[t.pri]}</span><span class="${late?'late':''}">${late?'Overdue, ':'Due '}${fmtDue(t)}</span>${t.note?', '+esc(t.note):''}</small></span></div>`;
}
function itemRow(it,main,nextId){
  const o=it.o,k=it.date;
  if(it.k==='t')return taskRow(o);
  if(it.k==='d'){const a=ageTxt(o,k);
    return `<div class="ev"><span class="tm"><small>All day</small></span><span><button class="lnk" data-edit="d:${o.id}">${esc(o.title)}</button><small>${o.label}${a?', '+a:''}${o.note?', '+esc(o.note):''}</small></span><span></span></div>`}
  const dn=(o.done||{})[k];
  return `<div class="ev ${dn?'done':''} ${o.id===nextId?'next':''}">
    <span class="tm">${o.time}${o.end?`<small>to ${o.end}</small>`:''}</span>
    <span><button class="lnk" data-edit="e:${o.id}" data-date="${k}">${esc(o.title)}</button>${o.note?`<small>${esc(o.note)}</small>`:''}</span>
    ${main?`<input class="ck" type="checkbox" aria-label="Done: ${esc(o.title)}" ${dn?'checked':''} data-done="${o.id}">`:'<span></span>'}</div>`;
}

/* ---------- render ---------- */
function renderMain(){
  const now=new Date(),h=now.getHours(),k=ymd(now),hm=now.toTimeString().slice(0,5);
  $('#greet').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  $('#today').textContent=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  if(wx){$('#wxT').textContent=Math.round(wx.now)+'°';$('#wxD').textContent=WX[wx.code]||'Weather';
    $('#wxS').textContent=`High ${wx.max}°, low ${wx.min}°, rain ${wx.rain}%`+(cfg.city?' in '+cfg.city:'')}
  const its=dayItems(now).filter(i=>i.k!=='t');
  const nx=its.find(i=>i.k==='e'&&i.t>=hm&&!(i.o.done||{})[k]);
  $('#todayList').innerHTML=its.length?its.map(i=>itemRow(i,true,nx&&nx.o.id)).join(''):'<p class="empty">Nothing planned today.</p>';
  const key=t=>t.due+(t.time||'99');
  const open=tasks.filter(t=>!t.done).sort((a,b)=>key(a)<key(b)?-1:key(a)>key(b)?1:a.pri-b.pri),done=tasks.filter(t=>t.done);
  $('#taskList').innerHTML=(open.length?open.map(taskRow).join(''):'<p class="empty">No open tasks.</p>')
    +(done.length?`<details style="margin-top:10px"><summary class="empty">Completed (${done.length})</summary>${done.map(taskRow).join('')}<button class="x" data-tclear="1">Clear completed</button></details>`:'');
  const total=events.length+tasks.length+dates.length;
  const days=cfg.lastBackup?Math.floor((Date.now()-new Date(cfg.lastBackup))/864e5):null;
  $('#nudge').classList.toggle('hide',!(total>0&&(days===null||days>=14)));
  $('#nudgeT').textContent=days===null?'You have not saved a backup yet.':`Your last backup was ${days} days ago.`;
}
function renderCal(){
  const body=$('#calBody'),M=new Date(calRef);
  if(calView==='week'){
    const s=new Date(M);s.setDate(s.getDate()-((s.getDay()+6)%7));
    const e=new Date(s);e.setDate(e.getDate()+6);
    $('#calT').textContent=dLabel(ymd(s)).slice(4)+' to '+dLabel(ymd(e)).slice(4);
    let html='';
    for(let i=0;i<7;i++){const d=new Date(s);d.setDate(d.getDate()+i);const its=dayItems(d);
      html+=`<section class="card"><h2>${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})}</h2>${its.length?its.map(x=>itemRow(x,false)).join(''):'<p class="empty">Nothing planned.</p>'}</section>`}
    body.innerHTML=html;
  }else{
    M.setDate(1);
    $('#calT').textContent=M.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    const lead=(M.getDay()+6)%7,n=new Date(M.getFullYear(),M.getMonth()+1,0).getDate(),today=ymd(new Date());
    if(calSel.slice(0,7)!==ymd(M).slice(0,7))calSel=ymd(M);
    let g=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<b>${d}</b>`).join('')+'<span></span>'.repeat(lead);
    for(let i=1;i<=n;i++){const d=new Date(M.getFullYear(),M.getMonth(),i),k=ymd(d),its=dayItems(d);
      const dots=['e','t','d'].filter(c=>its.some(x=>x.k===c)).map(c=>`<i class="${c==='t'?'d1':c==='d'?'d2':''}"></i>`).join('');
      g+=`<button class="cell ${k===calSel?'sel':''} ${k===today?'tod':''}" data-day="${k}" aria-label="${dLabel(k)}">${i}<span class="dots">${dots}</span></button>`}
    const its=dayItems(new Date(calSel+'T00:00'));
    body.innerHTML=`<div class="grid">${g}</div><section class="card"><h2>${dLabel(calSel)}</h2>${its.length?its.map(x=>itemRow(x,false)).join(''):'<p class="empty">Nothing planned.</p>'}</section>`;
  }
}
function renderSet(){
  $('#city').value=cfg.city||'';$('#brief').value=cfg.brief;
  const p='Notification' in window?Notification.permission:'unsupported';
  $('#status').textContent=p==='granted'?'Notifications are on. Keep the app installed so reminders can arrive.':p==='denied'?'Notifications are blocked. Allow them in Chrome site settings.':p==='unsupported'?'This browser does not support notifications.':'Notifications are off.';
  $('#lastB').textContent=cfg.lastBackup?'Last backup: '+new Date(cfg.lastBackup).toLocaleString('en-GB'):'No backup saved yet.';
  try{$('#shr').classList.toggle('hide',!(navigator.canShare&&navigator.canShare({files:[backupFile()]})))}catch{}
}
function render(){renderMain();if($('#pCal').classList.contains('on'))renderCal();if($('#pSet').classList.contains('on'))renderSet()}

/* ---------- routing ---------- */
const PAGES={'':'pMain',add:'pAdd',calendar:'pCal',settings:'pSet'};
const go=h=>{if(location.hash.slice(1)===h)route();else location.hash=h};
function route(){
  const id=PAGES[location.hash.slice(1)]||'pMain';
  $$('.page').forEach(p=>p.classList.toggle('on',p.id===id));
  if(id!=='pAdd')editing=null;else editing?fillForm():resetForm();
  render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- form ---------- */
const curKind=()=>$('input[name=kind]:checked').value;
function setKind(k){
  $(`input[name=kind][value=${k}]`).checked=true;
  $('#evBox').classList.toggle('hide',k!=='event');$('#taBox').classList.toggle('hide',k!=='task');$('#dtBox').classList.toggle('hide',k!=='date');
  $('#title').placeholder={event:'Math class, gym',task:'History essay',date:'Anna’s birthday'}[k];
  $('#save').textContent=editing?'Save changes':'Add '+{event:'event',task:'task',date:'yearly date'}[k];
}
function typeCh(){const t=$('#type').value;$('#dateBox').classList.toggle('hide',t!=='once');$('#dayBox').classList.toggle('hide',t!=='weekly')}
function resetForm(){
  editing=null;const tm=new Date();tm.setDate(tm.getDate()+1);
  $('#formH').textContent='Add new';$('#kind').classList.remove('hide');$('#del').classList.add('hide');$('#msg').textContent='';
  $('#title').value='';$('#note').value='';$('#type').value='once';$('#date').value=ymd(new Date());
  $('#time').value='08:00';$('#end').value='';$('#lead').value='15';$$('#days input').forEach(i=>i.checked=false);
  $('#tdue').value=ymd(tm);$('#ttime').value='';$('#pri').value='2';$('#tlead').value='60';
  $('#dlabel').value='Birthday';$('#ddate').value=ymd(new Date());$('#dAge').checked=true;$('#dlead').value='0';
  typeCh();setKind('event');
}
function fillForm(){
  const E=editing,kind=E.kind;
  const o=(kind==='event'?events:kind==='task'?tasks:dates).find(x=>x.id===E.id);
  if(!o){editing=null;resetForm();return}
  resetForm();editing=E;
  const e=kind==='event'&&E.date?eff(o,E.date):o;
  $('#formH').textContent='Edit '+(kind==='date'?'yearly date':kind)+(kind==='event'&&o.type!=='once'&&E.date?' ('+dLabel(E.date)+')':'');
  $('#kind').classList.add('hide');$('#del').classList.remove('hide');
  $('#title').value=e.title;$('#note').value=e.note||'';
  if(kind==='event'){
    $('#type').value=o.type;typeCh();$('#date').value=o.date||ymd(new Date());
    $$('#days input').forEach(i=>{i.checked=(o.days||[]).includes(+i.value)});
    $('#time').value=e.time;$('#end').value=e.end||'';$('#lead').value=String(e.lead||0);
  }else if(kind==='task'){
    $('#tdue').value=o.due;$('#ttime').value=o.time||'';$('#pri').value=String(o.pri);$('#tlead').value=String(o.lead);
  }else{
    $('#dlabel').value=o.label;$('#ddate').value=`${o.year}-${o.md}`;$('#dAge').checked=!!o.showAge;$('#dlead').value=String(o.lead);
  }
  setKind(kind);
}
const msg=t=>{$('#msg').textContent=t};
function askScope(verb,cb){
  const d=$('#scope');$('#sVerb').textContent=verb;$('#sOne').textContent='Only '+dLabel(editing.date);
  const fin=v=>{d.close();if(v)cb(v)};
  $('#sOne').onclick=()=>fin('one');$('#sAll').onclick=()=>fin('all');$('#sNo').onclick=()=>fin(null);
  d.showModal();
}
const finish=()=>{editing=null;saveAll();go('')};
$('#kind').onchange=()=>setKind(curKind());
$('#type').onchange=typeCh;
$('#days').innerHTML=[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" value="${d}"><span>${DN[d]}</span></label>`).join('');

$('#save').onclick=()=>{
  const title=$('#title').value.trim(),kind=curKind(),note=$('#note').value.trim();
  if(!title){msg('Enter a title.');$('#title').focus();return}
  if(kind==='task'){
    const due=$('#tdue').value;if(!due){msg('Pick a deadline.');return}
    const t={title,pri:+$('#pri').value,due,time:$('#ttime').value,lead:+$('#tlead').value,note};
    if(editing)Object.assign(tasks.find(x=>x.id===editing.id),t);else tasks.push({id:Date.now().toString(36),done:false,...t});
    return finish();
  }
  if(kind==='date'){
    const v=$('#ddate').value;if(!v){msg('Pick a date.');return}
    const x={title,label:$('#dlabel').value,md:v.slice(5),year:+v.slice(0,4),showAge:$('#dAge').checked,lead:+$('#dlead').value,note};
    if(editing)Object.assign(dates.find(y=>y.id===editing.id),x);else dates.push({id:Date.now().toString(36),...x});
    return finish();
  }
  const time=$('#time').value,end=$('#end').value,type=$('#type').value;
  if(!time){msg('Pick a start time.');return}
  if(end&&end<=time){msg('The end time must be after the start time.');return}
  const n={title,time,end,type,lead:+$('#lead').value,note};
  if(type==='once'){n.date=$('#date').value;if(!n.date){msg('Pick a date.');return}}
  if(type==='weekly'){n.days=$$('#days input:checked').map(i=>+i.value);if(!n.days.length){msg('Pick at least one day.');return}}
  if(!editing){events.push({id:Date.now().toString(36),done:{},...n});return finish()}
  const o=events.find(x=>x.id===editing.id);
  const apply=scope=>{
    if(scope==='one'){o.over=o.over||{};o.over[editing.date]={title:n.title,time:n.time,end:n.end,note:n.note,lead:n.lead}}
    else{Object.assign(o,{title,time,end,type,lead:n.lead,note});
      if(type==='once')o.date=n.date;else delete o.date;
      if(type==='weekly')o.days=n.days;else delete o.days}
    finish();
  };
  if(o.type!=='once'&&editing.date)askScope('Apply your changes to:',apply);else apply('all');
};
$('#del').onclick=()=>{
  const E=editing;if(!E)return;
  const drop=()=>{if(E.kind==='event')events=events.filter(x=>x.id!==E.id);else if(E.kind==='task')tasks=tasks.filter(x=>x.id!==E.id);else dates=dates.filter(x=>x.id!==E.id);finish()};
  if(E.kind==='event'){
    const o=events.find(x=>x.id===E.id);
    if(o.type!=='once'&&E.date){askScope('Delete:',v=>{if(v==='one'){o.over=o.over||{};o.over[E.date]={skip:true};finish()}else drop()});return}
  }
  if(confirm('Delete this item?'))drop();
};

/* ---------- clicks ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-go],[data-edit],[data-tclear],[data-day]');if(!b)return;
  const d=b.dataset;
  if(d.go!==undefined)go(d.go);
  else if(d.edit){const [k,id]=d.edit.split(':');editing={kind:{e:'event',t:'task',d:'date'}[k],id,date:d.date||null};go('add')}
  else if(d.tclear!==undefined){tasks=tasks.filter(x=>!x.done);saveAll();render()}
  else if(d.day){calSel=d.day;renderCal()}
});
document.addEventListener('change',ev=>{
  const d=ev.target.dataset||{};
  if(d.done){const e=events.find(x=>x.id===d.done),k=ymd(new Date());e.done=e.done||{};if(ev.target.checked)e.done[k]=1;else delete e.done[k];saveAll();render()}
  else if(d.tdone){tasks.find(x=>x.id===d.tdone).done=ev.target.checked;saveAll();render()}
});
$$('input[name=cv]').forEach(r=>r.onchange=()=>{calView=r.value;if(calView==='month')calSel=ymd(calRef);renderCal()});
const step=n=>{if(calView==='week')calRef.setDate(calRef.getDate()+7*n);else{calRef.setDate(1);calRef.setMonth(calRef.getMonth()+n)}renderCal()};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);

/* ---------- backup ---------- */
const backupObj=()=>({app:'daybook',version:3,exported:new Date().toISOString(),events,tasks,dates,settings:{city:cfg.city,lat:cfg.lat,lon:cfg.lon,brief:cfg.brief}});
const backupFile=()=>new File([JSON.stringify(backupObj(),null,1)],`daybook-backup-${ymd(new Date())}.json`,{type:'application/json'});
function marked(){cfg.lastBackup=new Date().toISOString();saveAll();render()}
function download(){
  const f=backupFile(),a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);marked();
  $('#smsg').textContent='Backup saved to your Downloads folder as '+f.name+'. Keep a copy in Drive or send it to yourself.';
}
$('#exp').onclick=download;
$('#nudgeBtn').onclick=download;
$('#shr').onclick=async()=>{try{await navigator.share({files:[backupFile()],title:'Daybook backup'});marked()}catch{}};
$('#imp').onchange=async ev=>{
  const f=ev.target.files[0];if(!f)return;
  try{
    const j=JSON.parse(await f.text());if(j.app!=='daybook')throw 0;
    const merge=(a,b)=>{const m=new Map(a.map(x=>[x.id,x]));(b||[]).forEach(x=>{if(x&&x.id)m.set(x.id,x)});return[...m.values()]};
    events=merge(events,j.events);tasks=merge(tasks,j.tasks);dates=merge(dates,j.dates);
    if(j.settings&&cfg.lat==null&&!cfg.city)Object.assign(cfg,j.settings);
    saveAll();render();fetchWeather();
    $('#smsg').textContent=`Restored: ${(j.events||[]).length} events, ${(j.tasks||[]).length} tasks, ${(j.dates||[]).length} yearly dates.`;
  }catch{$('#smsg').textContent='That file is not a Daybook backup.'}
  ev.target.value='';
};

/* ---------- settings ---------- */
async function fetchWeather(){
  if(cfg.lat==null)return;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${cfg.lat}&longitude=${cfg.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`;
    const j=await (await fetch(u)).json();
    wx={now:j.current.temperature_2m,code:j.current.weather_code,max:Math.round(j.daily.temperature_2m_max[0]),min:Math.round(j.daily.temperature_2m_min[0]),rain:j.daily.precipitation_probability_max[0]||0};
    save('db_wx',wx);render();
  }catch{$('#wxS').textContent='Could not load weather. Check your connection.'}
}
$('#city').addEventListener('change',async()=>{
  const name=$('#city').value.trim();if(!name)return;
  try{
    const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1`)).json();
    if(!j.results){$('#status').textContent='City not found. Try another spelling.';return}
    const r=j.results[0];cfg.city=r.name;cfg.lat=r.latitude;cfg.lon=r.longitude;saveAll();fetchWeather();render();
  }catch{$('#status').textContent='Could not look up that city.'}
});
$('#geo').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{
  cfg.lat=p.coords.latitude;cfg.lon=p.coords.longitude;cfg.city='';saveAll();fetchWeather();
},()=>{$('#status').textContent='Location was blocked. Type your city instead.'});
$('#brief').onchange=()=>{cfg.brief=$('#brief').value||'07:30';saveAll()};
$('#notif').onclick=async()=>{if(!('Notification' in window))return;await Notification.requestPermission();render();tick()};

/* ---------- notifications ---------- */
async function notify(title,body){
  try{if(swReg)await swReg.showNotification(title,{body,tag:title+body,icon:'icon-192.png',vibrate:[120,60,120]});else new Notification(title,{body})}
  catch(e){try{new Notification(title,{body})}catch{}}
}
function tick(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=new Date(),today=ymd(now),tom=new Date(now.getTime()+864e5);
  for(const k of Object.keys(fired))if(!k.startsWith(today))delete fired[k];
  for(const e0 of events){
    const onToday=occursOn(e0,now);
    if(!onToday&&!occursOn(e0,tom))continue;
    const base=onToday?now:tom,bk=ymd(base),e=eff(e0,bk);
    if(!onToday&&!(e.lead>=1440))continue;
    const t=at(base,e.time).getTime(),fire=t-(e.lead||0)*6e4,key=today+'|'+e.id;
    if(now>=fire&&now.getTime()<=t+10*6e4&&!fired[key]&&!(e.done||{})[bk]){
      fired[key]=1;
      notify(e.title,(e.lead?`Starts at ${e.time}`:`Now, ${e.time}`)+(e.end?` until ${e.end}`:'')+(e.note?'. '+e.note:''));
    }
  }
  for(const t of tasks){
    if(t.done||t.lead<0||firedT[t.id])continue;
    const due=at(new Date(t.due+'T00:00'),t.time||'09:00').getTime(),fire=due-t.lead*6e4;
    if(now.getTime()>=fire&&now.getTime()<=due+6*36e5){firedT[t.id]=1;notify('Task: '+t.title,`Due ${fmtDue(t)}, ${PRI[t.pri].toLowerCase()} priority`+(t.note?'. '+t.note:''))}
  }
  for(const x of dates){
    if(x.lead<0||now.getHours()<9)continue;
    const occ=new Date(now.getFullYear(),now.getMonth(),now.getDate()+x.lead),ok=ymd(occ);
    if(ok.slice(5)!==x.md||firedD[x.id+'|'+ok])continue;
    firedD[x.id+'|'+ok]=1;const a=ageTxt(x,ok);
    notify((x.lead===0?'Today: ':x.lead===1?'Tomorrow: ':'In 7 days: ')+x.title,(a?a+'. ':'')+(x.note||''));
  }
  const b=at(now,cfg.brief).getTime();
  if(now>=b&&now.getTime()<=b+60*6e4&&!fired[today+'|brief']){
    fired[today+'|brief']=1;
    const its=dayItems(now),n=its.filter(i=>i.k!=='t').length,tc=its.length-n;
    notify('Good morning',`${n} on your schedule`+(tc?`, ${tc} task${tc===1?'':'s'} due`:'')+'. '+wxSummary());
  }
  save('db_fired',fired);save('db_firedT',firedT);save('db_firedD',firedD);
}

/* ---------- start ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
route();fetchWeather();tick();
setInterval(tick,20000);setInterval(render,60000);setInterval(fetchWeather,30*60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();tick();fetchWeather()}});
</script>
</body>
